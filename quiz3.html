<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .delivery-container {
        display: flex;
        align-items: flex-end; 
        gap: 10px; 
        }
        .box {
        border-width: 2px;
        border-style: solid;
        border-color: black;
        }
        .delivery-box {
        width: 300px;  
        height: 60px;   
        padding: 8px;   
        font-size: 14px; 
        vertical-align: top; 
        }
        .delivery-label {
        
        margin-bottom: 8px; 
        font-weight: bold;
        }
    </style>

</head>
<body>
    <form action="#">
        <label for="name">고객명:</label>
        <input type="text" id="name" name="name">
        <br><br>
        <label for="tel">전화번호:</label>
        <input type="text" id="tel" name="tel">
        <br><br>
        <label for="email">E-mail:</label>
        <input type="text" id="email" name="email">
        <br><br>
        <label for="selectcf">피자선택:</label>
        <select id="selectcf" name="selectcf">
            <option value="option1" disabled selected>피자를 선택하세요</option>
            <option value="option2">치즈</option>
            <option value="option3">페퍼로니</option>
            <option value="option4">콤비네이션</option>
        </select>
        <fieldset class="box">
            <legend>피자사이즈</legend>
            <input type="radio" id="small" name="size" value="small">
            <label for="card">Small</label><br><br>
            <input type="radio" id="medium" name="size" value="medium"> 
            <label for="card">Medium</label><br><br>
            <input type="radio" id="large" name="size" value="large">
            <label for="card">Large</label><br><br>
        </fieldset>
        <fieldset class="box">
            <legend>토핑선택</legend>
            <input type="checkbox" id="topping1" name="topping1" value="topping1">
            <label for="topping1">베이컨</label><br><br>
            <input type="checkbox" id="topping2" name="topping2" value="topping2">
            <label for="topping2">치즈</label><br><br>
            <input type="checkbox" id="topping3" name="topping3" value="topping3">
            <label for="topping3">양파</label><br><br>
            <input type="checkbox" id="topping4" name="topping4" value="topping4">
            <label for="topping4">버섯</label><br><br>
        </fieldset>
        <label for="name">희망배송시간 : </label>
        <input type="time" value="희망배송시간"><br><br>

        <div class="delivery-container">
        <label for="name" class="delivery-label">배송시 요청 사항:</label>
        <textarea id="request" name="request" class="delivery-box" placeholder="요청사항을 입력해주세요."></textarea>
        </div>    
        <br>
        <button type="submit">주문하기</button>
        
    </form>
</body>
</html>
